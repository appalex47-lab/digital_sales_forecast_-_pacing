<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prueba técnica IndexedDB · Digital Sales Forecast &amp; Pacing</title>
<style>
  body { font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: #1c2430; margin: 0; background: #f4f6f8; }
  header { background: #0E5E6F; color: #fff; padding: 20px 24px; }
  header h1 { margin: 0; font-size: 22px; }
  header p { margin: 4px 0 0; opacity: .85; }
  main { max-width: 1040px; margin: 0 auto; padding: 20px 24px 60px; }
  section { background: #fff; border: 1px solid #dde2e8; border-radius: 10px; padding: 16px 20px; margin-bottom: 16px; }
  label { font-size: 13px; color: #4a5566; display: grid; gap: 4px; }
  input { font: inherit; padding: 6px 8px; width: 120px; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; align-items: end; }
  button { font: inherit; font-weight: 600; padding: 8px 14px; border-radius: 6px; border: 1px solid #0E5E6F; background: #0E5E6F; color: #fff; cursor: pointer; }
  button.secondary { background: #fff; color: #0E5E6F; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #e6e9ee; vertical-align: top; }
  th { font-size: 13px; color: #4a5566; }
  .ok { color: #2E7D4F; font-weight: 700; } .fail { color: #B42318; font-weight: 700; } .muted { color: #6b7686; font-size: 13px; }
  #progress { height: 8px; background: #e6e9ee; border-radius: 4px; overflow: hidden; margin-top: 12px; }
  #progress span { display: block; height: 100%; width: 0; background: #0E5E6F; transition: width .1s; }
  #ticker { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<header>
  <h1>Prueba técnica de IndexedDB</h1>
  <p>Datos diarios por SKU generados en tu navegador. No toca los datos de la app (usa una base separada).</p>
</header>
<main>
  <section>
    <div class="row">
      <label>Días <input id="days" type="number" value="90" min="1"></label>
      <label>SKUs activos por canal y día <input id="skus" type="number" value="1500" min="1"></label>
      <label>Canales <input id="channels" type="number" value="4" min="1" max="4"></label>
      <label style="display:flex;gap:6px;align-items:center"><input id="withA" type="checkbox" style="width:auto"> Incluir diseño A (lento)</label>
      <button id="run">Ejecutar prueba</button>
      <button id="clean" class="secondary">Borrar base de prueba</button>
    </div>
    <p class="muted" id="plan"></p>
    <div id="progress"><span></span></div>
    <p class="muted">Reloj de la interfaz (debe avanzar sin congelarse durante la carga): <span id="ticker">0</span></p>
  </section>
  <section>
    <table><thead><tr><th>#</th><th>Verificación</th><th>Resultado</th><th>Detalle</th></tr></thead><tbody id="results"></tbody></table>
  </section>
  <section id="summary" hidden></section>
</main>
<script src="../js/storage/idb.js"></script>
<script src="idb-proof.js"></script>
</body>
</html>
